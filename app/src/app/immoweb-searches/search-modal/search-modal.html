@if (modalOpen) {
  <app-modal [title]="draft ? (draft.name || 'Nouvelle recherche') : 'Recherches Immoweb'" (close)="closeModal()">
    @if (draft) {
      <form autocomplete="off" (ngSubmit)="saveDraft()">
        <div class="content">
          <div class="field">
            <label for="searchName">Nom</label>
            <input type="text" id="searchName" name="searchName" placeholder="Ex. Maisons Ixelles" [(ngModel)]="draft.name">
          </div>

          <div class="field">
            <label for="propertyType">Type de bien</label>
            <app-dropdown [items]="propertyTypeOptions" [attributes]="['value']" [(ngModel)]="draft.propertyType" id="propertyType" name="propertyType"></app-dropdown>
          </div>

          <div class="field">
            <label for="postalCodes">Codes postaux</label>
            <input type="text" id="postalCodes" name="postalCodes" placeholder="1000, 1040, 1050" [(ngModel)]="draft.postalCodes">
            <div class="flex flex-wrap gap-1">
              @for (m of quickPostalCodes; track m.code) {
                <button type="button" class="chip" [class.selected]="hasPostalCode(m.code)" (click)="togglePostalCode(m.code)">{{ m.code }} {{ m.name }}</button>
              }
            </div>
          </div>

          <div class="field">
            <label for="minPrice">Prix</label>
            <div class="flex gap-2">
              <input type="text" inputmode="numeric" placeholder="Min" appThousandSeparator id="minPrice" name="minPrice" [(ngModel)]="draft.minPrice">
              <input type="text" inputmode="numeric" placeholder="Max" appThousandSeparator id="maxPrice" name="maxPrice" [(ngModel)]="draft.maxPrice">
            </div>
          </div>

          <div class="field">
            <label for="minBedroomCount">Chambres min.</label>
            <input type="text" inputmode="numeric" placeholder="Ex. 2" appThousandSeparator id="minBedroomCount" name="minBedroomCount" [(ngModel)]="draft.minBedroomCount">
          </div>

          <app-toggle [(ngModel)]="draft.active" name="draftActive" [id]="'draftActive'" [label]="'Active à la prochaine synchronisation'" />

          @if (draftError) {
            <p class="error">{{ draftError }}</p>
          }
        </div>

        <div class="commands">
          <button type="button" class="secondary" (click)="cancelEdit()">Annuler</button>
          <button type="submit" class="primary">Enregistrer</button>
        </div>
      </form>
    } @else {
      <div class="content">
        @for (search of searchesService.searches; track search.id) {
          <app-search-row class="block pb-3 border-b border-gray-100 last:border-b-0 last:pb-0" [search]="search" [toggleId]="'search-' + search.id" [removable]="true"
            (edit)="edit(search)" (remove)="remove(search)" />
        } @empty {
          <p class="empty">Aucune recherche enregistrée.</p>
        }
      </div>

      <div class="commands">
        <button type="button" class="secondary mr-auto" (click)="newSearch()"><i class="far fa-plus"></i> Nouvelle recherche</button>
        <button type="button" class="primary" (click)="closeModal()">Fermer</button>
      </div>
    }
  </app-modal>
}
