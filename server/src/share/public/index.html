<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avis sur les biens</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9fafb;
      color: #111827;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 14px;
      color: #6b7280;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 176px;
      object-fit: cover;
      background: #f3f4f6;
    }

    .card .no-photo {
      width: 100%;
      height: 176px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 14px;
      background: #f3f4f6;
    }

    .card .body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .price {
      font-size: 20px;
      font-weight: 600;
    }

    .title {
      font-size: 14px;
      color: #374151;
    }

    .locality {
      font-size: 14px;
      color: #6b7280;
    }

    .details {
      font-size: 14px;
      color: #6b7280;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    a.link {
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
    }

    a.link:hover {
      text-decoration: underline;
    }

    .sentiment {
      display: flex;
      gap: 8px;
    }

    .sentiment button {
      flex: 1;
      padding: 6px 0;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #4b5563;
      cursor: pointer;
    }

    .sentiment button.active-positif {
      background: #059669;
      border-color: #059669;
      color: #fff;
    }

    .sentiment button.active-negatif {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }

    textarea {
      width: 100%;
      font-size: 13px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      resize: vertical;
      font-family: inherit;
      margin-top: auto;
    }

    .saved {
      font-size: 12px;
      color: #059669;
      height: 14px;
    }

    .owner-note {
      font-size: 13px;
      color: #374151;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 8px;
    }

    .owner-note .label {
      font-size: 11px;
      font-weight: 600;
      color: #1e40af;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 2px;
    }

    .empty,
    .error {
      max-width: 1000px;
      margin: 40px auto;
      text-align: center;
      color: #6b7280;
      padding: 0 20px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Ton avis sur ces biens</h1>
    <p>Indique si tu es plutôt pour ou contre, et pourquoi.</p>
  </header>
  <main id="grid"></main>
  <div id="empty" class="empty" style="display:none">Aucun bien à noter pour l'instant.</div>
  <div id="error" class="error" style="display:none">Lien invalide ou expiré — redemande un lien à jour.</div>

  <script>
    const TOKEN = "__TOKEN__";
    const grid = document.getElementById('grid');

    function formatPrice(value) {
      if (value === null || value === undefined) return '—';
      return new Intl.NumberFormat('fr-BE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(value);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function renderCard(listing) {
      const card = document.createElement('div');
      card.className = 'card';

      const media = listing.pictureUrl
        ? `<img src="${listing.pictureUrl}" alt="">`
        : `<div class="no-photo">Pas de photo</div>`;

      const details = [];
      if (listing.bedroomCount !== null) details.push(`${listing.bedroomCount} ch.`);
      if (listing.netHabitableSurface !== null) details.push(`${listing.netHabitableSurface} m² hab.`);
      if (listing.landSurface !== null) details.push(`${listing.landSurface} m² terrain`);

      const ownerNoteHtml = listing.ownerNote
        ? `<div class="owner-note"><div class="label">Mon avis</div>${escapeHtml(listing.ownerNote)}</div>`
        : '';

      card.innerHTML = `
        ${media}
        <div class="body">
          <div class="price">${formatPrice(listing.price)}</div>
          <div class="title">${escapeHtml(listing.title)}</div>
          <div class="locality">${escapeHtml(listing.locality)} (${escapeHtml(listing.postalCode)})</div>
          <div class="details">${details.join(' · ')}</div>
          <a class="link" href="${listing.url}" target="_blank" rel="noopener">Voir sur Immoweb ↗</a>
          ${ownerNoteHtml}
          <div class="sentiment">
            <button type="button" data-sentiment="positif">Plutôt positif</button>
            <button type="button" data-sentiment="negatif">Plutôt négatif</button>
          </div>
          <textarea rows="2" placeholder="Pourquoi ?">${escapeHtml(listing.feedbackNote)}</textarea>
          <div class="saved"></div>
        </div>
      `;

      const buttons = card.querySelectorAll('.sentiment button');
      const textarea = card.querySelector('textarea');
      const saved = card.querySelector('.saved');
      let currentSentiment = listing.feedbackSentiment;

      function paintSentiment() {
        buttons.forEach((btn) => {
          btn.classList.toggle('active-' + btn.dataset.sentiment, btn.dataset.sentiment === currentSentiment);
        });
      }
      paintSentiment();

      function flashSaved() {
        saved.textContent = 'Enregistré ✓';
        setTimeout(() => { saved.textContent = ''; }, 2000);
      }

      async function patch(body) {
        const res = await fetch(`/${TOKEN}/listings/${listing.immowebId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (res.ok) flashSaved();
      }

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const next = currentSentiment === btn.dataset.sentiment ? null : btn.dataset.sentiment;
          currentSentiment = next;
          paintSentiment();
          patch({ feedbackSentiment: next });
        });
      });

      textarea.addEventListener('blur', () => {
        patch({ feedbackNote: textarea.value.trim() || null });
      });

      return card;
    }

    fetch(`/${TOKEN}/listings`)
      .then((res) => {
        if (!res.ok) throw new Error('bad token');
        return res.json();
      })
      .then((listings) => {
        if (listings.length === 0) {
          document.getElementById('empty').style.display = 'block';
          return;
        }
        listings.forEach((listing) => grid.appendChild(renderCard(listing)));
      })
      .catch(() => {
        document.getElementById('error').style.display = 'block';
      });
  </script>
</body>

</html>
