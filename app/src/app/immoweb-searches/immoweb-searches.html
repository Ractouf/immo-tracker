<div class="relative flex items-stretch">
  <div class="py-1 px-2 flex items-center gap-2 flex-wrap border border-gray-200 bg-gray-50 rounded-l-lg">
    <span class="text-sm text-gray-400"><i class="far fa-house-circle-check"></i> Immoweb</span>
    @for (search of searchesService.active; track search.id) {
      <div class="py-1 px-3 pr-2 flex gap-2 border border-gray-200 rounded-lg bg-white font-medium text-sm cursor-pointer hover:border-blue-300" [title]="summary(search)"
        (click)="editSearch.emit(search)">
        <span class="text-blue-600">{{ search.name }}</span>
        <div class="text-blue-600 cursor-pointer" title="Désactiver" (click)="$event.stopPropagation(); deactivate(search)"><i class="fas fa-times fa-fw"></i></div>
      </div>
    } @empty {
      <span class="text-sm text-gray-400 italic">Aucune recherche active</span>
    }
  </div>
  <div class="w-8 min-h-8 shrink-0 flex items-center justify-center bg-blue-600 rounded-r-lg text-white cursor-pointer" title="Ajouter une recherche" (click)="toggleMenu()">
    <i class="far fa-plus"></i>
  </div>

  @if (menuOpen) {
    <div class="menu">
      @for (search of searchesService.inactive; track search.id) {
        <button type="button" class="menu-item" [title]="summary(search)" (click)="activate(search)">
          <i class="far fa-plus fa-fw text-gray-400"></i>{{ search.name }}
        </button>
      }
      @if (searchesService.inactive.length > 0) {
        <div class="border-t border-gray-100 my-1"></div>
      }
      <button type="button" class="menu-item" (click)="newSearch()"><i class="far fa-pen-to-square fa-fw text-gray-400"></i>Nouvelle recherche…</button>
      <button type="button" class="menu-item" (click)="openModal()"><i class="far fa-gear fa-fw text-gray-400"></i>Gérer les recherches…</button>
    </div>
  }
</div>
