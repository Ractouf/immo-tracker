<div class="relative">
  <button type="button" class="secondary" [class.active]="menuOpen" (click)="toggleMenu()">
    Recherches
    <app-badge class="text-xs" [color]="searchesService.active.length === 0 ? 'red' : 'gray'" [text]="searchesService.active.length + '/' + searchesService.searches.length" />
    <i class="far fa-angle-down text-gray-400"></i>
  </button>

  @if (menuOpen) {
    <div class="menu">
      @for (search of searchesService.searches; track search.id) {
        <div class="search-row">
          <app-toggle [ngModel]="search.active" (ngModelChange)="searchesService.setActive(search.id, $event)" [id]="'menu-search-' + search.id" />
          <div class="min-w-0 flex-1">
            <div class="text-sm font-medium text-gray-900 truncate">{{ search.name }}</div>
            <div class="text-xs text-gray-500 truncate">{{ summary(search) }}</div>
          </div>
          <button type="button" class="icon" title="Modifier" (click)="edit(search)"><i class="far fa-pen fa-fw"></i></button>
        </div>
      }
      <div class="border-t border-gray-100"></div>
      <button type="button" class="menu-item" (click)="newSearch()"><i class="far fa-plus fa-fw text-gray-400"></i>Nouvelle recherche…</button>
      <button type="button" class="menu-item" (click)="openModal()"><i class="far fa-gear fa-fw text-gray-400"></i>Gérer les recherches…</button>
    </div>
  }
</div>
