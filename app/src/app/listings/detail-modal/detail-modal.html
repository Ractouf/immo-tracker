<div class="modal p-4" (click)="$event.target === $event.currentTarget ? close.emit() : null">
  <div class="relative flex flex-col gap-2 w-full max-w-sm">
    <app-card [listing]="listing" mode="detail" />
    <button type="button" class="round absolute top-2 right-2" title="Fermer" (click)="close.emit()">
      <i class="far fa-times"></i>
    </button>
    @if (error) {
      <p class="error rounded-lg bg-white px-3 py-2">{{ error }}</p>
    }
    @if (canUnlink) {
      <button type="button" class="danger ml-auto" [class]="unlinkState" [disabled]="unlinkState === SaveState.Loading" (click)="unlink()">Dissocier</button>
    }
  </div>
</div>
