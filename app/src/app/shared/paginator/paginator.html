<div class="flex items-center justify-end gap-3 text-sm text-gray-600">
  @if (!compact) {
    <app-dropdown [items]="sizeItems" [attributes]="['value']" [ngModel]="pageSize" (ngModelChange)="pageSizeChange.emit($event)" />
  }
  @if (!compact) {
    <span class="whitespace-nowrap">{{ rangeLabel }}</span>
  }
  <div class="flex gap-2">
    <a class="page-button" title="Page précédente" [class.disabled]="page === 0" [attr.href]="page > 0 && pageUrl ? pageUrl(page - 1) : null" (click)="onPageClick($event, page - 1)">
      <i class="far fa-angle-left fa-fw"></i>
    </a>
    <a class="page-button" title="Page suivante" [class.disabled]="page >= lastPage" [attr.href]="page < lastPage && pageUrl ? pageUrl(page + 1) : null"
      (click)="onPageClick($event, page + 1)">
      <i class="far fa-angle-right fa-fw"></i>
    </a>
  </div>
</div>
