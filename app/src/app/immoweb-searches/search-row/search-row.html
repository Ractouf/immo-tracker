<div class="flex items-center gap-3">
  <app-toggle [ngModel]="search.active" (ngModelChange)="searchesService.setActive(search.id, $event)" [id]="toggleId" />
  <div class="min-w-0 flex-1">
    <div class="text-sm font-medium text-gray-900 truncate">{{ search.name }}</div>
    <div class="text-xs text-gray-500 truncate" [title]="summary">{{ summary }}</div>
  </div>
  <button type="button" class="icon" title="Modifier" (click)="edit.emit()"><i class="far fa-pen fa-fw"></i></button>
  @if (removable) {
    <button type="button" class="icon" title="Supprimer" (click)="remove.emit()"><i class="far fa-trash fa-fw"></i></button>
  }
</div>
