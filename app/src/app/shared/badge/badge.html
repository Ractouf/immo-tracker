<div class="badge inline-flex items-center gap-2 px-3 rounded-full font-xs font-medium border capitalize whitespace-nowrap" [class]="color">

  @if (showDot) {
    <div class="dot w-2 h-2 rounded-full"></div>
  }

  @if (icon) {
    <div><i [class]="'far fa-' + icon"></i></div>
  }

  {{ text }}
</div>
